name: daily-scan

# Runs our five scanners on a few public projects whenever one of them gets a new commit, by itself.
# The projects belong to other people, so GitHub cannot tell us when they push. Instead a quick check
# runs every 15 minutes, compares each project's latest commit with the last one we scanned, and only
# scans the projects that changed. Nobody has to change any code: the owners keep pushing, so results stay new.
# Results are sent straight to the portal when the PORTAL_URL and PORTAL_API_KEY secrets are set
# (real-time push), and are always saved as files ("artifacts") that scripts/fetch_daily.py can bring in later.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"  # every 15 minutes (GitHub is busiest at :00, so runs start more on time)
  workflow_dispatch:               # the "Run workflow" button, for the demo: always scans every project

concurrency:               # if one run is still going when the next one starts, the new one waits
  group: daily-scan
  cancel-in-progress: false

jobs:
  # Which projects have a commit we have not scanned yet? Takes a few seconds.
  # A scanned commit is remembered as a small cache entry named scanned-<project>-<commit>.
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read           # to look up the cache entries
    outputs:
      todo: ${{ steps.new.outputs.todo }}
    steps:
      - name: Look for new commits
        id: new
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          # alias: the name shown in the portal. repo: the public project.
          # image + url: a running copy of the website, for ZAP (DAST). Leave empty to skip ZAP.
          PROJECTS: |
            [
              {"alias": "Project G", "repo": "juice-shop/juice-shop",
               "image": "bkimminich/juice-shop:latest", "url": "http://localhost:3000"},
              {"alias": "Project H", "repo": "WebGoat/WebGoat",
               "image": "webgoat/webgoat:latest", "url": "http://localhost:8080/WebGoat"},
              {"alias": "Project I", "repo": "GoogleCloudPlatform/microservices-demo",
               "image": "", "url": ""}
            ]
        run: |
          todo='[]'
          while read -r p; do
            alias=$(jq -r .alias <<< "$p"); repo=$(jq -r .repo <<< "$p")
            sha=$(git ls-remote "https://github.com/$repo" HEAD | cut -f1)
            slug=$(tr 'A-Z ' 'a-z-' <<< "$alias")
            key="scanned-$slug-$sha"
            seen=$(gh cache list --repo "$GITHUB_REPOSITORY" --key "$key" --json key --jq length)
            if [ -z "$sha" ]; then
              echo "$alias: could not read the latest commit, skipped"
            elif [ "$FORCE" = true ] || [ "$seen" = 0 ]; then
              echo "$alias: new commit ${sha:0:7}, will scan"
              todo=$(jq -c --argjson p "$p" --arg sha "$sha" --arg key "$key" '. + [$p + {sha: $sha, key: $key}]' <<< "$todo")
            else
              echo "$alias: ${sha:0:7} already scanned, nothing to do"
            fi
          done < <(jq -c '.[]' <<< "$PROJECTS")
          echo "todo=$todo" >> "$GITHUB_OUTPUT"

  scan:
    name: scan ${{ matrix.alias }}
    needs: check
    if: needs.check.outputs.todo != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false      # one project failing does not stop the others
      matrix:
        include: ${{ fromJSON(needs.check.outputs.todo) }}
    steps:
      - name: Get the project's latest code
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Remember which version was scanned
        run: |
          mkdir -p reports
          cd target
          printf '{"alias": "%s", "repo": "%s", "commit_sha": "%s", "branch": "%s", "scanned_at": "%s"}\n' \
            "${{ matrix.alias }}" "${{ matrix.repo }}" "$(git rev-parse HEAD)" \
            "$(git rev-parse --abbrev-ref HEAD)" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > ../reports/target.json
          cat ../reports/target.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep and Checkov
        run: pip install semgrep checkov

      - name: Semgrep (SAST)
        continue-on-error: true
        working-directory: target
        run: semgrep scan --config p/default --metrics=off --json --output ../reports/semgrep.json .

      # --offline-scan: do not ask Maven Central about Java libraries; it blocks GitHub's machines
      # when too many ask at once ("429 Too Many Requests"). Trivy's own list of known problems is still used.
      - name: Trivy on the code (SCA + IaC)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/work" aquasec/trivy:latest fs --quiet --offline-scan \
            --scanners vuln,misconfig --format json --output /work/reports/trivy-code.json /work/target

      - name: Trivy on the released app (SCA)
        if: matrix.image != ''
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" aquasec/trivy:latest \
            image --quiet --scanners vuln --format json --output /work/reports/trivy-app.json ${{ matrix.image }}

      - name: Checkov (IaC)
        continue-on-error: true
        run: checkov -d target --quiet --compact --soft-fail -o json --output-file-path reports

      # SonarQube keeps its results on a server, so we start a fresh one just for this run,
      # scan the code, save the security results to reports/sonarqube.json, then stop it.
      - name: Get our scripts (for SonarQube)
        uses: actions/checkout@v4
        with:
          path: portal
          sparse-checkout: scripts
          persist-credentials: false

      - name: Start SonarQube
        id: sonar
        continue-on-error: true
        run: |
          sudo sysctl -w vm.max_map_count=262144
          docker run -d --name sonarqube --network host -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true sonarqube:community
          for i in $(seq 1 60); do
            curl -s http://localhost:9000/api/system/status | grep -q '"UP"' && break
            sleep 5
          done
          curl -s http://localhost:9000/api/system/status | grep -q '"UP"' || { docker logs sonarqube | tail -50; exit 1; }
          # A new random password every run (the server is thrown away at the end), then a token to use it.
          PW="Pw-$(openssl rand -hex 16)"
          echo "::add-mask::$PW"
          curl -sf -u admin:admin -X POST http://localhost:9000/api/users/change_password \
            --data-urlencode login=admin --data-urlencode previousPassword=admin --data-urlencode "password=$PW"
          TOKEN=$(curl -sf -u "admin:$PW" -X POST http://localhost:9000/api/user_tokens/generate \
            -d name=daily-scan -d type=USER_TOKEN | python -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$TOKEN"
          echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "SONAR_PROJECT=$(echo '${{ matrix.alias }}' | tr 'A-Z ' 'a-z-')" >> "$GITHUB_ENV"

      # sonar.java.binaries: Java code is normally built first; an empty folder lets SonarQube scan it unbuilt.
      - name: SonarQube (SAST)
        if: steps.sonar.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p /tmp/no-build
          docker run --rm --network host -v "$PWD/target:/usr/src" -v /tmp/no-build:/no-build \
            -e SONAR_HOST_URL=http://localhost:9000 -e SONAR_TOKEN sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey="$SONAR_PROJECT" -Dsonar.java.binaries=/no-build -Dsonar.scm.disabled=true \
            -Dsonar.working.directory=/tmp/scannerwork
          SONAR_HOST_URL=http://localhost:9000 python portal/scripts/export_sonarqube.py \
            --project "$SONAR_PROJECT" --out reports/sonarqube.json

      - name: Stop SonarQube
        if: always() && steps.sonar.outcome != 'skipped'
        run: docker rm -f sonarqube || true

      - name: Start the website for ZAP
        if: matrix.image != ''
        run: |
          docker run -d --name app --network host ${{ matrix.image }}
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "${{ matrix.url }}" && echo "website is up" && exit 0
            sleep 5
          done
          echo "website did not start"; docker logs app | tail -50; exit 1

      - name: ZAP (DAST)
        if: matrix.image != ''
        continue-on-error: true
        run: |
          chmod 777 reports
          docker run --rm --network host -v "$PWD/reports:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "${{ matrix.url }}" -J zap.json -I -m 3 || [ $? -ne 3 ]
          # ZAP says "1" when it finds a serious problem. That is a result, not an error; only 3 means ZAP itself broke.

      - name: What was saved
        if: always()
        run: ls -la reports

      # Real-time push: the results reach the portal as soon as this project's scan finishes.
      # Needs two repository secrets: PORTAL_URL (the portal's public address) and PORTAL_API_KEY.
      # Without them this step only prints a note, and fetch_daily.py / auto-fetch bring the results in.
      - name: Send results to the portal (real time)
        if: always()
        continue-on-error: true
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          PORTAL_API_KEY: ${{ secrets.PORTAL_API_KEY }}
        run: |
          python portal/scripts/push_reports.py reports --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --status "${{ job.status }}"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-${{ matrix.alias }}
          path: reports/
          retention-days: 7    # hourly runs make many files; the portal already has the results

      # Remember this commit as scanned, so the 15-minute check skips it until the project changes again.
      - name: Remember this commit was scanned
        if: always()
        uses: actions/cache/save@v4
        with:
          path: reports/target.json
          key: ${{ matrix.key }}
