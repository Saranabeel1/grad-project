name: daily-scan

# Runs our 20 scanners (5 per category) on a few public projects whenever one of them gets a new commit, by itself.
# The projects belong to other people, so GitHub cannot tell us when they push. Instead a quick check
# runs every 15 minutes, compares each project's latest commit with the last one we scanned, and only
# scans the projects that changed. Nobody has to change any code: the owners keep pushing, so results stay new.
#
# The scanners are split into four jobs that run at the same time, one per category:
#   SAST  Semgrep, SonarQube, CodeQL, Bearer, Bandit
#   SCA   Trivy, OSV-Scanner, Grype, OWASP Dependency-Check, OWASP Dependency-Track
#   DAST  ZAP, Nuclei, Wapiti, Nikto, Dastardly (only for projects with a website to start)
#   IaC   Checkov, KICS, Kubescape, Conftest, Hadolint (Trivy's misconfiguration checks are shown here too)
# A last job ("report") collects their reports, runs the Security Gate and sends everything to the portal.
# Each scanner step has continue-on-error, so one tool failing never stops the others.
#
# Results are sent straight to the portal when the PORTAL_URL and PORTAL_API_KEY secrets are set
# (real-time push), and are always saved as files ("artifacts") that scripts/fetch_daily.py can bring in later.
# OWASP Dependency-Check reads NIST's NVD database, prepared once a day by the "Update NVD database" job.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"  # every 15 minutes (GitHub is busiest at :00, so runs start more on time)
  workflow_dispatch:               # the "Run workflow" button, for the demo: always scans every project

concurrency:               # if one run is still going when the next one starts, the new one waits
  group: daily-scan
  cancel-in-progress: false

jobs:
  # Which projects have a commit we have not scanned yet? Takes a few seconds.
  # A scanned commit is remembered as a small cache entry named scanned-<project>-<commit>.
  check:
    runs-on: ubuntu-latest
    permissions:
      actions: read           # to look up the cache entries
    outputs:
      todo: ${{ steps.new.outputs.todo }}
      todo_web: ${{ steps.new.outputs.todo_web }}
    steps:
      - name: Look for new commits
        id: new
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          # alias: the name shown in the portal. repo: the public project.
          # image + url: a running copy of the website, for the DAST tools (one Docker image).
          # k8s + url: for apps made of many services: the Kubernetes file (in the project) that starts them all.
          # Leave image, k8s and url empty to skip DAST.
          # codeql: the languages CodeQL should look at (ones that need no build step).
          PROJECTS: |
            [
              {"alias": "Project G", "repo": "juice-shop/juice-shop",
               "image": "bkimminich/juice-shop:latest", "url": "http://localhost:3000",
               "codeql": "javascript-typescript"},
              {"alias": "Project H", "repo": "WebGoat/WebGoat",
               "image": "webgoat/webgoat:latest", "url": "http://localhost:8080/WebGoat",
               "codeql": "java-kotlin,javascript-typescript"},
              {"alias": "Project I", "repo": "GoogleCloudPlatform/microservices-demo",
               "image": "", "k8s": "release/kubernetes-manifests.yaml", "url": "http://localhost:8090",
               "codeql": "python,csharp,java-kotlin,javascript-typescript"}
            ]
        run: |
          todo='[]'
          while read -r p; do
            alias=$(jq -r .alias <<< "$p"); repo=$(jq -r .repo <<< "$p")
            head=$(git ls-remote --symref "https://github.com/$repo" HEAD)
            sha=$(awk '$2 == "HEAD" && $1 != "ref:" {print $1}' <<< "$head")
            branch=$(awk '$1 == "ref:" {sub("refs/heads/", "", $2); print $2}' <<< "$head")
            slug=$(tr 'A-Z ' 'a-z-' <<< "$alias")
            key="scanned-$slug-$sha"
            seen=$(gh cache list --repo "$GITHUB_REPOSITORY" --key "$key" --json key --jq length)
            if [ -z "$sha" ]; then
              echo "$alias: could not read the latest commit, skipped"
            elif [ "$FORCE" = true ] || [ "$seen" = 0 ]; then
              echo "$alias: new commit ${sha:0:7}, will scan"
              todo=$(jq -c --argjson p "$p" --arg sha "$sha" --arg branch "$branch" --arg key "$key" --arg slug "$slug" \
                '. + [$p + {sha: $sha, branch: $branch, key: $key, slug: $slug}]' <<< "$todo")
            else
              echo "$alias: ${sha:0:7} already scanned, nothing to do"
            fi
          done < <(jq -c '.[]' <<< "$PROJECTS")
          echo "todo=$todo" >> "$GITHUB_OUTPUT"
          echo "todo_web=$(jq -c '[.[] | select(.image != "" or (.k8s // "") != "")]' <<< "$todo")" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------- SAST: reads the source code
  sast:
    name: SAST ${{ matrix.alias }}
    needs: check
    if: needs.check.outputs.todo != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
      security-events: read   # CodeQL; results are saved as a file, not uploaded to GitHub
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.todo) }}
    steps:
      - name: Get the project's code (the commit the check found)
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Get our scripts
        uses: actions/checkout@v4
        with:
          path: portal
          sparse-checkout: |
            scripts
            policy
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep and Bandit
        run: |
          mkdir -p reports
          pip install semgrep bandit

      - name: Semgrep
        continue-on-error: true
        working-directory: target
        run: semgrep scan --config p/default --metrics=off --json --output ../reports/semgrep.json .

      - name: Bandit (Python only)
        continue-on-error: true
        run: bandit -r target -f json -o reports/bandit.json -q --exit-zero -x '*/node_modules/*'

      # Bearer downloads its rules from GitHub when it starts. "gitleaks" (leaked keys) findings are skipped by the reader.
      - name: Bearer
        continue-on-error: true
        timeout-minutes: 25
        run: |
          latest_version() {  # newest release, read from the project's git tags (no GitHub API limit)
            git ls-remote --tags --refs "https://github.com/$1" | awk -F/ '{print $3}' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1
          }
          v=$(latest_version Bearer/bearer)
          curl -sSfL "https://github.com/Bearer/bearer/releases/download/$v/bearer_${v#v}_linux_amd64.tar.gz" | tar xz bearer
          ./bearer scan target --format json --output reports/bearer.json --quiet \
            --exit-code 0 --disable-version-check --skip-path "node_modules,**/node_modules/**"

      # CodeQL: GitHub's own scanner. "upload: never" keeps the results in a file for the portal
      # instead of the Security tab of this repository (they are someone else's findings).
      - name: CodeQL (prepare)
        id: codeql
        continue-on-error: true
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.codeql }}
          build-mode: none
          source-root: target

      - name: CodeQL (analyse)
        if: steps.codeql.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 45
        uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: codeql-results
          category: daily-${{ matrix.slug }}

      - name: CodeQL (save results)
        if: steps.codeql.outcome == 'success'
        continue-on-error: true
        run: for f in codeql-results/*.sarif; do cp "$f" "reports/codeql-$(basename "$f" .sarif).json"; done

      # SonarQube keeps its results on a server, so we start a fresh one just for this run,
      # scan the code, save the security results to reports/sonarqube.json, then stop it.
      - name: Start SonarQube
        id: sonar
        continue-on-error: true
        run: |
          sudo sysctl -w vm.max_map_count=262144
          docker run -d --name sonarqube --network host -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true sonarqube:community
          for i in $(seq 1 60); do
            curl -s http://localhost:9000/api/system/status | grep -q '"UP"' && break
            sleep 5
          done
          curl -s http://localhost:9000/api/system/status | grep -q '"UP"' || { docker logs sonarqube | tail -50; exit 1; }
          # A new random password every run (the server is thrown away at the end), then a token to use it.
          PW="Pw-$(openssl rand -hex 16)"
          echo "::add-mask::$PW"
          curl -sf -u admin:admin -X POST http://localhost:9000/api/users/change_password \
            --data-urlencode login=admin --data-urlencode previousPassword=admin --data-urlencode "password=$PW"
          TOKEN=$(curl -sf -u "admin:$PW" -X POST http://localhost:9000/api/user_tokens/generate \
            -d name=daily-scan -d type=USER_TOKEN | python -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$TOKEN"
          echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "SONAR_PROJECT=${{ matrix.slug }}" >> "$GITHUB_ENV"

      # sonar.java.binaries: Java code is normally built first; an empty folder lets SonarQube scan it unbuilt.
      - name: SonarQube
        if: steps.sonar.outcome == 'success'
        continue-on-error: true
        run: |
          mkdir -p /tmp/no-build
          docker run --rm --network host -v "$PWD/target:/usr/src" -v /tmp/no-build:/no-build \
            -e SONAR_HOST_URL=http://localhost:9000 -e SONAR_TOKEN sonarsource/sonar-scanner-cli \
            -Dsonar.projectKey="$SONAR_PROJECT" -Dsonar.java.binaries=/no-build -Dsonar.scm.disabled=true \
            -Dsonar.working.directory=/tmp/scannerwork
          SONAR_HOST_URL=http://localhost:9000 python portal/scripts/export_sonarqube.py \
            --project "$SONAR_PROJECT" --out reports/sonarqube.json

      - name: Stop SonarQube
        if: always() && steps.sonar.outcome != 'skipped'
        run: docker rm -f sonarqube || true

      - name: What was saved
        if: always()
        run: ls -la reports

      - name: Keep the reports for the report job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parts-${{ matrix.slug }}-sast
          path: reports/
          retention-days: 1

  # ---------------------------------------------------------------- NVD database for Dependency-Check
  # Dependency-Check needs NIST's vulnerability database (NVD). It is built once here (not by three jobs at the
  # same time), at most once a day, and kept in GitHub's cache; the SCA jobs then only read it.
  # It is built from NVD's yearly data files (one download per year, nvdcve-2.0-<year>.json.gz) instead of
  # the NVD API, which pages through 300,000+ entries slowly and with a speed limit. No key is needed for this.
  nvd:
    name: Update NVD database
    needs: check
    if: needs.check.outputs.todo != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      actions: write          # to delete yesterday's copy of the database from the cache
    outputs:
      key: ${{ steps.day.outputs.key }}
    steps:
      - name: Today's database name
        id: day
        run: echo "key=dependency-check-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Get the saved database
        id: saved
        uses: actions/cache/restore@v4
        with:
          path: dc-data
          key: ${{ steps.day.outputs.key }}
          restore-keys: dependency-check-20   # only daily copies (dependency-check-2026-...), not older test copies

      # The first time this downloads every year's file (a few hundred MB); after that only the changed ones.
      - name: Download new NVD entries
        id: update
        if: steps.saved.outputs.cache-hit != 'true'
        timeout-minutes: 60
        run: |
          # The saved copy comes back owned by GitHub's user; the Dependency-Check container runs as another
          # user, so make every file writable (otherwise: "The database is read only").
          mkdir -p dc-data && sudo chmod -R a+rwX dc-data
          docker run --rm -v "$PWD/dc-data:/usr/share/dependency-check/data" owasp/dependency-check:latest \
            --updateonly --nvdDatafeed "https://nvd.nist.gov/feeds/json/cve/2.0/nvdcve-2.0-{0}.json.gz"

      - name: Save today's database
        if: steps.update.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: dc-data
          key: ${{ steps.day.outputs.key }}

      # Keep only today's copy, so the big database does not push other cache entries out.
      - name: Delete older copies
        if: steps.update.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key dependency-check- --json key --jq '.[].key' \
            | grep -vx "${{ steps.day.outputs.key }}" \
            | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY" || true

  # ---------------------------------------------------------------- SCA: checks the libraries the project uses
  sca:
    name: SCA ${{ matrix.alias }}
    needs: [check, nvd]
    # Runs even if the NVD download failed; then only Dependency-Check is skipped.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.todo != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.todo) }}
    steps:
      - name: Get the project's code (the commit the check found)
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Get our scripts
        uses: actions/checkout@v4
        with:
          path: portal
          sparse-checkout: scripts
          persist-credentials: false

      # --offline-scan: do not ask Maven Central about Java libraries; it blocks GitHub's machines
      # when too many ask at once ("429 Too Many Requests"). Trivy's own list of known problems is still used.
      # Trivy's misconfiguration results (--scanners misconfig) are shown under IaC in the portal.
      - name: Trivy on the code (SCA + IaC)
        continue-on-error: true
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/work" aquasec/trivy:latest fs --quiet --offline-scan \
            --scanners vuln,misconfig --format json --output /work/reports/trivy-code.json /work/target

      - name: Trivy on the released app
        if: matrix.image != ''
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" aquasec/trivy:latest \
            image --quiet --scanners vuln --format json --output /work/reports/trivy-app.json ${{ matrix.image }}

      # Exit code 1 means "found vulnerabilities", 128 means "no lockfiles found": both are results, not errors.
      - name: OSV-Scanner
        continue-on-error: true
        run: |
          curl -sSfL -o osv-scanner https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x osv-scanner
          code=0
          ./osv-scanner scan source -r --format json --output-file reports/osv-scanner.json target || code=$?
          [ "$code" -le 1 ] || [ "$code" -eq 128 ]

      - name: Grype on the code
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/work" anchore/grype:latest dir:/work/target -o json --file /work/reports/grype-code.json

      - name: Grype on the released app
        if: matrix.image != ''
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/work" anchore/grype:latest \
            ${{ matrix.image }} -o json --file /work/reports/grype-app.json

      # Dependency-Check reads the NVD database prepared by the "Update NVD database" job (--noupdate).
      - name: Dependency-Check (get the NVD database)
        id: nvd
        if: needs.nvd.result == 'success'
        uses: actions/cache/restore@v4
        with:
          path: dc-data
          key: ${{ needs.nvd.outputs.key }}
          restore-keys: dependency-check-20   # only daily copies (dependency-check-2026-...), not older test copies

      - name: OWASP Dependency-Check
        if: steps.nvd.outputs.cache-matched-key != ''
        continue-on-error: true
        timeout-minutes: 30
        run: |
          # sudo: some reports were written by other tools' containers (as root).
          sudo chmod -R a+rwX dc-data reports
          docker run --rm -v "$PWD/target:/src:ro" -v "$PWD/reports:/report" \
            -v "$PWD/dc-data:/usr/share/dependency-check/data" owasp/dependency-check:latest \
            --scan /src --format JSON --out /report --project "${{ matrix.alias }}" --noupdate \
            --disableOssIndex --disableYarnAudit --disablePnpmAudit --exclude "**/node_modules/**" --exclude "**/.git/**"
          mv reports/dependency-check-report.json reports/dependency-check.json

      # Dependency-Track is a server, like SonarQube: a fresh one per run, thrown away at the end.
      # It gets the project's parts list (SBOM, made by Trivy) and matches it against Google's OSV database.
      - name: Dependency-Track
        continue-on-error: true
        timeout-minutes: 45
        run: |
          docker run -d --name dtrack -p 8081:8080 dependencytrack/apiserver:latest
          docker run --rm -v "$PWD:/work" aquasec/trivy:latest fs --quiet --offline-scan \
            --format cyclonedx --output /work/sbom.cdx.json /work/target
          DT_URL=http://localhost:8081 python3 portal/scripts/export_dependency_track.py \
            --sbom sbom.cdx.json --project "${{ matrix.slug }}" --out reports/dependency-track.json --container dtrack

      - name: Stop Dependency-Track
        if: always()
        run: docker rm -f dtrack || true

      - name: What was saved
        if: always()
        run: ls -la reports

      - name: Keep the reports for the report job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parts-${{ matrix.slug }}-sca
          path: reports/
          retention-days: 1

  # ---------------------------------------------------------------- DAST: attacks a running copy of the website
  dast:
    name: DAST ${{ matrix.alias }}
    needs: check
    if: needs.check.outputs.todo_web != '[]' && needs.check.outputs.todo_web != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.todo_web) }}
    steps:
      - name: Start the website (one Docker image)
        if: matrix.image != ''
        run: |
          mkdir -p reports && chmod 777 reports
          docker run -d --name app --network host ${{ matrix.image }}
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "${{ matrix.url }}" && echo "website is up" && exit 0
            sleep 5
          done
          echo "website did not start"; docker logs app | tail -50; exit 1

      # Apps made of many services (Online Boutique has 11) run on Kubernetes. We start a small throwaway
      # Kubernetes cluster inside this job with "kind", install the project's released version from its own
      # Kubernetes file, and open the shop's front page on localhost:8090 for the DAST tools.
      - name: Prepare a Kubernetes cluster (many services)
        if: matrix.k8s != ''
        run: |
          mkdir -p reports && chmod 777 reports
          cat > kind.yaml <<'KIND'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
              extraPortMappings:
                - containerPort: 30080
                  hostPort: 8090
          KIND

      - name: Start the Kubernetes cluster
        if: matrix.k8s != ''
        uses: helm/kind-action@v1
        with:
          cluster_name: dast
          config: kind.yaml

      - name: Start the website (Kubernetes)
        if: matrix.k8s != ''
        run: |
          curl -sSfL -o app.yaml "https://raw.githubusercontent.com/${{ matrix.repo }}/${{ matrix.sha }}/${{ matrix.k8s }}"
          kubectl apply -f app.yaml
          # The load generator only creates fake shoppers; it would add noise to the scan.
          kubectl delete deployment loadgenerator --ignore-not-found
          # Make the shop's front page reachable from this machine on port 8090.
          kubectl patch service frontend-external -p \
            '{"spec":{"type":"NodePort","ports":[{"name":"http","port":80,"targetPort":8080,"nodePort":30080}]}}'
          kubectl wait --for=condition=available deployment --all --timeout=600s || { kubectl get pods; exit 1; }
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "${{ matrix.url }}" && echo "website is up" && exit 0
            sleep 5
          done
          echo "website did not start"; kubectl get pods; kubectl logs deployment/frontend --tail=50; exit 1

      - name: ZAP
        continue-on-error: true
        run: |
          docker run --rm --network host -v "$PWD/reports:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "${{ matrix.url }}" -J zap.json -I -m 3 || [ $? -ne 3 ]
          # ZAP says "1" when it finds a serious problem. That is a result, not an error; only 3 means ZAP itself broke.

      # Nuclei runs its known-problem checks ("templates"); it does not crawl. Info-level, denial-of-service,
      # fuzzing and intrusive checks are left out.
      - name: Nuclei
        continue-on-error: true
        timeout-minutes: 25
        run: |
          docker run --rm --network host -v "$PWD/reports:/out" projectdiscovery/nuclei:latest \
            -u "${{ matrix.url }}" -es info -etags dos,fuzz,intrusive -rl 100 -c 25 -timeout 5 \
            -stats -si 60 -je /out/nuclei.json || true
          # (Nuclei downloads its checks, "templates", when it starts; so no -disable-update-check here.)
          # Nuclei writes no file when it finds nothing; an empty list shows the scan did run.
          [ -f reports/nuclei.json ] || echo '[]' > reports/nuclei.json

      - name: Wapiti
        continue-on-error: true
        timeout-minutes: 25
        run: |
          pipx install --quiet wapiti3
          wapiti -u "${{ matrix.url }}/" --flush-session --max-scan-time 900 -d 3 --no-bugreport \
            -f json -o reports/wapiti.json

      - name: Nikto
        continue-on-error: true
        timeout-minutes: 20
        run: |
          sudo apt-get install -y -qq libjson-perl libxml-writer-perl libnet-ssleay-perl > /dev/null
          git clone --quiet --depth 1 https://github.com/sullo/nikto.git /tmp/nikto
          perl /tmp/nikto/program/nikto.pl -h "${{ matrix.url }}" -Format json -o reports/nikto.json \
            -maxtime 900s -ask no -nointeractive || true

      # Dastardly: Burp Suite's free scanner for pipelines (PortSwigger). Each scan stops after 10 minutes.
      # It writes a JUnit XML report, which report_readers.py reads.
      - name: Dastardly (Burp)
        continue-on-error: true
        timeout-minutes: 20
        run: |
          docker run --rm --user "$(id -u)" --network host -v "$PWD/reports:/report:rw" \
            -e BURP_START_URL="${{ matrix.url }}" -e BURP_REPORT_FILE_PATH=/report/dastardly.xml \
            public.ecr.aws/portswigger/dastardly:latest || true
          test -s reports/dastardly.xml

      - name: What was saved
        if: always()
        run: ls -la reports

      - name: Keep the reports for the report job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parts-${{ matrix.slug }}-dast
          path: reports/
          retention-days: 1

  # ---------------------------------------------------------------- IaC: checks Dockerfiles, Kubernetes, Terraform...
  iac:
    name: IaC ${{ matrix.alias }}
    needs: check
    if: needs.check.outputs.todo != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.todo) }}
    steps:
      - name: Get the project's code (the commit the check found)
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.sha }}
          path: target
          fetch-depth: 1
          persist-credentials: false

      - name: Get our Conftest rules
        uses: actions/checkout@v4
        with:
          path: portal
          sparse-checkout: policy
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkov
        continue-on-error: true
        run: |
          mkdir -p reports && chmod 777 reports
          pip install checkov
          checkov -d target --quiet --compact --soft-fail -o json --output-file-path reports

      # --disable-secrets: KICS's password/key search is turned off, as for the other tools.
      - name: KICS
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD/target:/path:ro" -v "$PWD/reports:/out" checkmarx/kics:latest scan \
            -p /path -o /out --output-name kics --report-formats json --ignore-on-exit all --silent \
            --disable-secrets --exclude-paths "/path/node_modules,/path/.git"

      # --keep-local: the results stay here and are not sent to Kubescape's cloud service.
      - name: Kubescape
        continue-on-error: true
        run: |
          latest_version() {  # newest release, read from the project's git tags (no GitHub API limit)
            git ls-remote --tags --refs "https://github.com/$1" | awk -F/ '{print $3}' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1
          }
          v=$(latest_version kubescape/kubescape)
          curl -sSfL -o kubescape "https://github.com/kubescape/kubescape/releases/download/$v/kubescape_${v#v}_linux_amd64"
          chmod +x kubescape
          ./kubescape scan target --format sarif --output reports/kubescape.sarif --keep-local
          # Kubescape adds ".sarif" to the name itself; the portal reads .json files.
          for f in reports/kubescape*.sarif; do [ -s "$f" ] && mv "$f" reports/kubescape.json; done; true

      # Conftest has no checks of its own; ours are in the policy/ folder (Dockerfiles + Kubernetes).
      # Helm templates ({{ ... }}) are not plain YAML, so they are left out.
      - name: Conftest
        continue-on-error: true
        working-directory: target
        run: |
          find . -type f -name 'Dockerfile*' -not -path '*/node_modules/*' | head -300 > /tmp/dockerfiles
          grep -rlE --include='*.yaml' --include='*.yml' --exclude-dir=node_modules --exclude-dir=.git \
            --exclude-dir=templates '^kind:' . | head -300 > /tmp/k8sfiles || true
          conftest() {
            docker run --rm -v "$PWD:/project:ro" -v "$PWD/../portal/policy:/policy:ro" openpolicyagent/conftest:latest \
              test --policy /policy --all-namespaces --no-fail -o json "$@"
          }
          echo '[]' > /tmp/c1.json; echo '[]' > /tmp/c2.json
          # --parser dockerfile: also reads files like "Dockerfile_desktop", which Conftest does not recognise by name.
          if [ -s /tmp/dockerfiles ]; then conftest --parser dockerfile $(cat /tmp/dockerfiles) > /tmp/c1.json; fi
          if [ -s /tmp/k8sfiles ]; then conftest $(cat /tmp/k8sfiles) > /tmp/c2.json; fi
          jq -s 'add' /tmp/c1.json /tmp/c2.json > ../reports/conftest.json

      # Hadolint checks Dockerfiles against best practices (running as root, unpinned versions, ...).
      # It exits with 1 when it finds something; that is a result, not an error.
      - name: Hadolint
        continue-on-error: true
        run: |
          curl -sSfL -o hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-linux-x86_64
          chmod +x hadolint
          find target -type f -name 'Dockerfile*' -not -path '*/node_modules/*' | head -300 > /tmp/dockerfiles
          if [ ! -s /tmp/dockerfiles ]; then echo "No Dockerfiles"; exit 0; fi
          ./hadolint -f json $(cat /tmp/dockerfiles) > reports/hadolint.json || true
          test -s reports/hadolint.json

      - name: What was saved
        if: always()
        run: ls -la reports

      - name: Keep the reports for the report job
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parts-${{ matrix.slug }}-iac
          path: reports/
          retention-days: 1

  # ---------------------------------------------------------------- collect, gate, send
  report:
    name: report ${{ matrix.alias }}
    needs: [check, sast, sca, dast, iac, nvd]
    if: ${{ !cancelled() && needs.check.outputs.todo != '[]' && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.todo) }}
    steps:
      - name: Get our scripts
        uses: actions/checkout@v4
        with:
          path: portal
          sparse-checkout: scripts
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect the four jobs' reports
        uses: actions/download-artifact@v4
        with:
          pattern: parts-${{ matrix.slug }}-*
          path: reports
          merge-multiple: true

      - name: Remember which version was scanned
        run: |
          mkdir -p reports
          printf '{"alias": "%s", "repo": "%s", "commit_sha": "%s", "branch": "%s", "scanned_at": "%s"}\n' \
            "${{ matrix.alias }}" "${{ matrix.repo }}" "${{ matrix.sha }}" "${{ matrix.branch }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > reports/target.json
          cat reports/target.json
          ls -la reports

      # Security Gate (as on the Pipeline Status page): Critical/High findings fail the run,
      # Medium/Low are only warnings. The results are still sent and saved below, marked as failed.
      - name: Security Gate
        run: python portal/scripts/security_gate.py reports

      # Real-time push: the results reach the portal as soon as this project's scan finishes.
      # Needs two repository secrets: PORTAL_URL (the portal's public address) and PORTAL_API_KEY.
      # Without them this step only prints a note, and fetch_daily.py / auto-fetch bring the results in.
      - name: Send results to the portal (real time)
        if: always()
        continue-on-error: true
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          PORTAL_API_KEY: ${{ secrets.PORTAL_API_KEY }}
        run: |
          python portal/scripts/push_reports.py reports --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --status "${{ job.status }}"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-${{ matrix.alias }}
          path: reports/
          retention-days: 7    # frequent runs make many files; the portal already has the results

      # Remember this commit as scanned, so the 15-minute check skips it until the project changes again.
      - name: Remember this commit was scanned
        if: always()
        uses: actions/cache/save@v4
        with:
          path: reports/target.json
          key: ${{ matrix.key }}
